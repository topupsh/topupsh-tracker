openapi: 3.1.0
info:
  title: topupsh-tracker API
  version: 0.1.0
  description: |
    The REST API lives under `/api/v1`. Sign-in for the web app lives under
    `/auth`.

    Authenticate API calls from the web app with the
    `topupsh_tracker_session` cookie. Root-only setup routes take the
    `topupsh_tracker_root` cookie set by `POST /api/v1/setup/login`; the
    same root session manages services' API keys and credit settings. Services call the API
    with their own key in `Authorization: Bearer <key>`.

    Errors are JSON `{"error": "<message>"}`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:2027
    description: Local development (`make dev-backend`)
tags:
  - name: Users
    description: The signed-in user.
  - name: Sign-in
    description: Web app sign-in with Google, GitHub or a custom OpenID Connect provider.
  - name: Setup
    description: Root-only server settings.
  - name: Services
    description: Root-only management of the API keys services call the API with.
  - name: Credits
    description: Root-only credit settings (the per-service switch, org and user limits, and grants).
  - name: Static
    description: Static assets.
security:
  - session: []

paths:
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/setup/login:
    post:
      tags: [Setup]
      operationId: rootLogin
      summary: Sign in as root
      description: |
        Exchanges the root access token for the `topupsh_tracker_root`
        session cookie, which covers the root-only routes. Limited to 10
        attempts per client IP per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The root access token.
      responses:
        "204":
          description: Signed in; sets the `topupsh_tracker_root` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/setup/logout:
    post:
      tags: [Setup]
      operationId: rootLogout
      summary: Sign out as root
      security: []
      responses:
        "204":
          description: Signed out; clears the `topupsh_tracker_root` cookie.

  /api/v1/setup/settings:
    get:
      tags: [Setup]
      operationId: getSettings
      summary: Get the settings
      description: Secrets are always empty; `secretsSet` says which are stored.
      security:
        - root: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Setup]
      operationId: updateSettings
      summary: Validate and save the settings
      description: An empty secret keeps the stored value.
      security:
        - root: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List the services
      description: |
        Every service, ordered by name, with its credit switch, its default
        limits and its API keys (newest first, revoked ones included; never
        the keys themselves).
      security:
        - root: []
      responses:
        "200":
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/keys:
    post:
      tags: [Services]
      operationId: createServiceApiKey
      summary: Create a service API key
      description: |
        Issues a new API key for the service, creating the service
        (with credit limiting disabled) when it is new. The key is in the
        response only this once; only its hash is stored. The service's
        other keys keep working: rotate a key by creating a new one and
        revoking the old one once every caller has switched.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, key]
                properties:
                  apiKey:
                    $ref: "#/components/schemas/ServiceApiKey"
                  key:
                    type: string
                    description: The key itself, shown only once.
                    example: tpk_3q2-7wE...
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/keys/{id}:
    delete:
      tags: [Services]
      operationId: revokeServiceApiKey
      summary: Revoke a service API key
      description: |
        The key stops authenticating at once. Revoking a revoked key
        succeeds.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
        - name: id
          in: path
          required: true
          description: The key ID from `apiKey.id`.
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/enabled:
    put:
      tags: [Credits]
      operationId: setServiceEnabled
      summary: Switch credit limiting on or off for a service
      description: |
        Credit limiting is off for a new service. While it is off nothing
        is charged or recorded.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The service after the switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/defaults:
    put:
      tags: [Credits]
      operationId: setServiceDefaults
      summary: Set a service's default limits
      description: |
        The default limits apply to every org of the service the admin
        set no limits for. A new service's default org limit is 0 and its
        users are uncapped.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgLimit]
              properties:
                orgLimit:
                  type: integer
                  format: int64
                  minimum: 0
                userLimit:
                  type: [integer, "null"]
                  format: int64
                  minimum: 0
                  description: Omitted or null for uncapped users.
      responses:
        "200":
          description: The service after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/orgs:
    get:
      tags: [Credits]
      operationId: listOrgUsage
      summary: List a service's orgs and their usage
      description: |
        The orgs with limits of their own or monthly credits spent this
        UTC month, ordered by org, with the limits that apply to them.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
      responses:
        "200":
          description: The orgs.
          content:
            application/json:
              schema:
                type: object
                required: [service, orgs]
                properties:
                  service:
                    type: string
                  orgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminOrgUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/services/{service}/users:
    get:
      tags: [Credits]
      operationId: listUserUsage
      summary: List a service's users and their usage
      description: |
        Up to 500 users with unexpired credits, ordered by org and user,
        with what they spent this UTC month.
      security:
        - root: []
      parameters:
        - $ref: "#/components/parameters/Service"
        - name: org
          in: query
          description: Only this org's users.
          schema:
            type: string
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [service, users, truncated]
                properties:
                  service:
                    type: string
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserUsage"
                  truncated:
                    type: boolean
                    description: True when more users have credits than are listed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/orgs/{org}/limits:
    put:
      tags: [Credits]
      operationId: setOrgLimits
      summary: Set an org's monthly limits for a service
      description: |
        Replaces the org's limits for the service. `orgLimit` is the
        credits the whole org may use in a month; omitted or null, it is
        the service's default org limit (0 until an admin changes it).
        `userLimit` is the credits each user of the org may use in a
        month; omitted or null, users are uncapped.
      security:
        - root: []
      parameters:
        - name: org
          in: path
          required: true
          description: The service's own org ID, 1 to 64 characters.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service]
              properties:
                service:
                  type: string
                  example: mesher
                orgLimit:
                  type: [integer, "null"]
                  format: int64
                  minimum: 0
                userLimit:
                  type: [integer, "null"]
                  format: int64
                  minimum: 0
      responses:
        "200":
          description: The org's limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgLimits"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/grants:
    post:
      tags: [Credits]
      operationId: createGrant
      summary: Grant a user extra credits
      description: |
        Adds a bucket of credits the user can spend, on top of the monthly
        limits, and records it in the ledger. It expires one month later,
        at the next 00:00 UTC (a day the next month lacks becomes its last
        day), when what is left of it is taken away.
      security:
        - root: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, org, user, credits]
              properties:
                service:
                  type: string
                  example: mesher
                org:
                  type: string
                  maxLength: 64
                user:
                  type: string
                  maxLength: 64
                credits:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: The new grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/charges:
    post:
      tags: [Credits]
      operationId: createCharge
      summary: Charge a user's credits
      description: |
        Spends a user's credits for one operation, in one transaction. The
        org limit is checked first, then the user's credits; credits are
        spent oldest bucket first. Grant credits don't count against the
        org limit, so a grant still works once the org limit is used up.
        A refused charge spends nothing. The request ID makes a retry
        safe, because a retry returns the original outcome, refused or
        not. While the service's credit limiting is off, every charge
        succeeds with `limited` false and nothing is spent or recorded.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, org, user, credits]
              properties:
                requestId:
                  type: string
                  maxLength: 128
                  description: Unique per service; a retry reuses it.
                org:
                  type: string
                  maxLength: 64
                user:
                  type: string
                  maxLength: 64
                credits:
                  type: integer
                  format: int64
                  minimum: 1
                operation:
                  type: string
                  maxLength: 255
                  example: github.create_issue
      responses:
        "200":
          description: Charged, or credit limiting is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "402":
          description: Refused by the org limit or the user limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The request ID was used for another org, user or number of credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/refunds:
    post:
      tags: [Credits]
      operationId: createRefund
      summary: Refund a charge
      description: |
        Gives a charge back to the buckets it came from, once, and records
        it in the ledger; a retry returns the same refund. Credits whose
        bucket has expired since are not returned. While the service's
        credit limiting is off, refunding an unknown request ID succeeds
        with `limited` false.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The charge was refused, so there is nothing to refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/view-tokens:
    post:
      tags: [Credits]
      operationId: createViewToken
      summary: Issue a view token for one user
      description: |
        Issues a signed token, valid for one hour, that lets one user of the
        calling service read their own balance and ledger. The service
        vouches for its user, so the user needs no topup.sh account: the
        service hands the token to the user's browser (e.g. in a link), which
        sends it as `Authorization: Bearer <token>` to `GET /api/v1/balances`
        and `GET /api/v1/ledger`.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, user]
              properties:
                org:
                  type: string
                  maxLength: 64
                user:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/balances:
    get:
      tags: [Credits]
      operationId: getBalance
      summary: Read one user's balance
      description: |
        Returns one user's credits in one service: the monthly allowance,
        the org's usage, the unexpired grants and what a charge can spend
        now. Reading changes nothing.

        - With a service key, the service reads its own users; `org` and
          `user` are required, and `service`, if given, must be its own.
        - With the root session, `service`, `org` and `user` are required.
        - With a view token, the service, org and user come from the token;
          naming any of them is a 400.
      security:
        - serviceKey: []
        - root: []
        - viewToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - $ref: "#/components/parameters/OrgQuery"
        - $ref: "#/components/parameters/UserQuery"
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/ledger:
    get:
      tags: [Credits]
      operationId: listLedgerEntries
      summary: Read the ledger
      description: |
        Returns the ledger, newest first, a page at a time: pass the
        `nextCursor` of a page as `cursor` to read the next one.

        - With a service key, only the service's own entries; `org` and
          `user` filter them, and `service`, if given, must be its own.
        - With the root session, every service's entries; `service`, `org`
          and `user` filter them.
        - With a view token, the token's user's entries; naming a service,
          org or user is a 400.

        `user` needs `org`, since user IDs are only unique within an org.
      security:
        - serviceKey: []
        - root: []
        - viewToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceQuery"
        - $ref: "#/components/parameters/OrgQuery"
        - $ref: "#/components/parameters/UserQuery"
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of the ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/config:
    get:
      tags: [Sign-in]
      operationId: getAuthConfig
      summary: List the sign-in providers
      security: []
      responses:
        "200":
          description: The enabled sign-in providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, name, icon]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        icon:
                          type: string

  /auth/{provider}/login:
    get:
      tags: [Sign-in]
      operationId: startLogin
      summary: Start signing in with a provider
      description: Redirects the browser to the provider's consent screen.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: redirect_url
          in: query
          description: Where in the app to land after signing in.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/{provider}/callback:
    get:
      tags: [Sign-in]
      operationId: completeLogin
      summary: Finish signing in
      description: |
        The provider redirects here. On success it sets the
        `topupsh_tracker_session` cookie and redirects into the app; on
        failure it redirects to `/login?error=<code>`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect into the app or to the login page.

  /auth/logout:
    post:
      tags: [Sign-in]
      operationId: logout
      summary: Sign out
      security: []
      responses:
        "204":
          description: Signed out; clears the `topupsh_tracker_session` cookie.

  /favicon.ico:
    get:
      tags: [Static]
      operationId: getFavicon
      summary: The app icon
      security: []
      responses:
        "200":
          description: The icon.
          content:
            image/x-icon:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: topupsh_tracker_session
      description: The web app's session, set by `/auth/{provider}/callback`.
    root:
      type: apiKey
      in: cookie
      name: topupsh_tracker_root
      description: The root session, set by `POST /api/v1/setup/login`.
    serviceKey:
      type: http
      scheme: bearer
      description: |
        A service's API key from `POST /api/v1/services/{service}/keys`.
        It identifies the service, so a service only reaches its own
        credits.
    viewToken:
      type: http
      scheme: bearer
      description: |
        A token from `POST /api/v1/view-tokens`. It lets one user of one
        service read their own credits for an hour.

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: A sign-in provider ID from `/auth/config`, e.g. `google`.
      schema:
        type: string

    Service:
      name: service
      in: path
      required: true
      description: |
        The service name: 1 to 64 lowercase letters, digits or dashes,
        starting with a letter or digit, e.g. `mesher`.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"

    ServiceQuery:
      name: service
      in: query
      description: A service name.
      schema:
        type: string
    OrgQuery:
      name: org
      in: query
      description: An org ID of the service.
      schema:
        type: string
        maxLength: 64
    UserQuery:
      name: user
      in: query
      description: A user ID of the org.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The credentials may not read this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, name, picture, provider, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        provider:
          type: string
        createdAt:
          type: string
          format: date-time

    ServiceApiKey:
      type: object
      required: [id, service, prefix, createdAt]
      properties:
        id:
          type: string
        service:
          type: string
        prefix:
          type: string
          description: The start of the key, to tell keys apart.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: Set once the key is revoked.

    CreditService:
      type: object
      required: [name, enabled, defaultOrgLimit, defaultUserLimit]
      properties:
        name:
          type: string
        enabled:
          type: boolean
        defaultOrgLimit:
          type: integer
          format: int64
          description: The monthly org limit of orgs without limits of their own.
        defaultUserLimit:
          type: [integer, "null"]
          format: int64
          description: The user limit of those orgs; null when uncapped.

    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/CreditService"
        - type: object
          required: [createdAt, apiKeys]
          properties:
            createdAt:
              type: string
              format: date-time
            apiKeys:
              type: array
              items:
                $ref: "#/components/schemas/ServiceApiKey"

    AdminOrgUsage:
      type: object
      required: [org, orgLimit, userLimit, custom, used]
      properties:
        org:
          type: string
        orgLimit:
          type: integer
          format: int64
        userLimit:
          type: [integer, "null"]
          format: int64
          description: Null when users are uncapped.
        custom:
          type: boolean
          description: False when the service's default limits apply.
        used:
          type: integer
          format: int64
          description: Monthly credits the org's users spent this UTC month.

    UserUsage:
      type: object
      required: [org, user, monthlyAllowance, monthlyUsed, grants, balance]
      properties:
        org:
          type: string
        user:
          type: string
        monthlyAllowance:
          type: integer
          format: int64
          description: The user's monthly credits under the current limits.
        monthlyUsed:
          type: integer
          format: int64
        grants:
          type: integer
          format: int64
          description: What is left of the user's unexpired grants.
        balance:
          type: integer
          format: int64
          description: The user's unexpired credits.

    OrgLimits:
      type: object
      required: [service, org, orgLimit, userLimit]
      properties:
        service:
          type: string
        org:
          type: string
        orgLimit:
          type: integer
          format: int64
        userLimit:
          type: [integer, "null"]
          format: int64
          description: Null when users are uncapped.

    Grant:
      type: object
      required: [id, service, org, user, credits, remaining, createdAt, expiresAt, balanceAfter]
      properties:
        id:
          type: string
        service:
          type: string
        org:
          type: string
        user:
          type: string
        credits:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        balanceAfter:
          type: integer
          format: int64
          description: The user's unexpired credits, this grant included.

    Charge:
      type: object
      required: [requestId, charged, limited]
      properties:
        requestId:
          type: string
        charged:
          type: boolean
        limited:
          type: boolean
          description: False while the service's credit limiting is off.
        reason:
          type: string
          enum: [org_limit, user_limit]
          description: Why a refused charge was refused.
        renewsAt:
          type: string
          format: date-time
          description: When a refused charge's monthly limits renew (the 1st, 00:00 UTC).
        balance:
          type: integer
          format: int64
          description: The user's unexpired credits after the charge.
        orgRemaining:
          type: integer
          format: int64
          description: What is left of the org limit this month.

    Refund:
      type: object
      required: [requestId, limited, credits]
      properties:
        requestId:
          type: string
        limited:
          type: boolean
          description: False for an unknown request while credit limiting is off.
        credits:
          type: integer
          format: int64
          description: The credits given back.
        refundedAt:
          type: string
          format: date-time
        balance:
          type: integer
          format: int64
          description: The user's unexpired credits now.

    Balance:
      type: object
      required: [service, org, user, limited, balance, available, monthly, orgUsage, grants, renewsAt]
      properties:
        service:
          type: string
        org:
          type: string
        user:
          type: string
        limited:
          type: boolean
          description: False while the service's credit limiting is off.
        balance:
          type: integer
          format: int64
          description: |
            The user's unexpired credits, as the ledger's `balanceAfter`
            counts them. The monthly allowance joins it with the user's
            first charge of the month.
        available:
          type: integer
          format: int64
          description: |
            What a charge can spend now: the grants, plus the monthly
            allowance as far as the org limit allows.
        monthly:
          type: object
          required: [limit, used, remaining]
          description: The user's monthly allowance this UTC month.
          properties:
            limit:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            remaining:
              type: integer
              format: int64
        orgUsage:
          type: object
          required: [limit, userLimit, used, remaining]
          description: The org's monthly limits and usage this UTC month.
          properties:
            limit:
              type: integer
              format: int64
            userLimit:
              type: integer
              format: int64
              nullable: true
              description: Null while users are uncapped.
            used:
              type: integer
              format: int64
            remaining:
              type: integer
              format: int64
        grants:
          type: array
          description: The user's unexpired grants, oldest (spent first) first.
          items:
            type: object
            required: [id, credits, remaining, createdAt, expiresAt]
            properties:
              id:
                type: string
              credits:
                type: integer
                format: int64
              remaining:
                type: integer
                format: int64
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
        renewsAt:
          type: string
          format: date-time
          description: When the monthly limits renew (the 1st, 00:00 UTC).

    LedgerEntry:
      type: object
      required: [id, service, org, user, kind, amount, balanceAfter, actor, createdAt]
      properties:
        id:
          type: string
        service:
          type: string
        org:
          type: string
        user:
          type: string
        kind:
          type: string
          enum: [spend, refund, grant, renewal, limit, expiry]
        amount:
          type: integer
          format: int64
          description: Signed; negative takes credits away.
        balanceAfter:
          type: integer
          format: int64
        actor:
          type: string
          description: Who or what made the change, e.g. a service, `root` or `scheduler`.
        operation:
          type: string
        createdAt:
          type: string
          format: date-time

    LedgerPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        nextCursor:
          type: string
          description: Reads the next page; left out on the last page.

    ViewToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: |
            The user's balance page with the token in the fragment
            (`<baseUrl>/balance#token=...`), for the service to link its
            user to. Left out when the app has no base URL.

    Settings:
      type: object
      description: Secrets are write-only; they are empty in responses.
      properties:
        domain:
          type: object
          properties:
            appUrl:
              type: string
            allowedOrigins:
              type: array
              items:
                type: string
        tls:
          type: object
          properties:
            enabled:
              type: boolean
            port:
              type: integer
            email:
              type: string
        database:
          type: object
          properties:
            driver:
              type: string
              enum: [sqlite, postgres]
            sqlite:
              type: object
              properties:
                dsn:
                  type: string
            postgres:
              type: object
              properties:
                dsn:
                  type: string
                  writeOnly: true
        auth:
          type: object
          properties:
            google:
              $ref: "#/components/schemas/OAuthClientSettings"
            github:
              $ref: "#/components/schemas/OAuthClientSettings"
            providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  icon:
                    type: string
                  clientId:
                    type: string
                  clientSecret:
                    type: string
                    writeOnly: true
                  authUrl:
                    type: string

    OAuthClientSettings:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true

    SettingsResponse:
      type: object
      required: [settings, secretsSet, restartRequired]
      properties:
        settings:
          $ref: "#/components/schemas/Settings"
        secretsSet:
          type: object
          description: Which secrets have a stored value.
          properties:
            postgresDsn:
              type: boolean
            googleClientSecret:
              type: boolean
            githubClientSecret:
              type: boolean
            providerClientSecrets:
              type: object
              additionalProperties:
                type: boolean
        restartRequired:
          type: boolean
